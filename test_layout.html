<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #input-area { 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            position: relative; 
            z-index: 10; 
            margin: 20px; 
            padding: 16px; 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); 
        }
        #input-area .d-flex.gap-1 { 
            flex-shrink: 0; 
            min-width: fit-content; 
        }
        #input-area button { 
            flex-shrink: 0; 
        }
        #message-input { 
            flex-grow: 1; 
            padding: 12px 16px; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            font-size: 14px; 
            background: #f8fafc; 
            color: #0f172a; 
            transition: all 0.2s ease; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Button Layout Test</h1>
        
        <div id="input-area" class="d-flex gap-2 p-2 border rounded shadow-sm align-items-center">
            <input type="text" id="message-input" class="form-control" placeholder="Type your message..." autocomplete="off">
            <div class="d-flex gap-1 align-items-center flex-shrink-0">
                <button class="btn btn-primary rounded-circle p-0 d-flex align-items-center justify-content-center" title="Send Message" style="width: 40px; height: 40px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-send-fill" viewBox="0 0 16 16">
                        <path d="m12.14 8.753-5.482 2.217c-.566.23-1.164-.043-1.164-.696V8.284l-1.63.853c-.534.28-1.174-.043-1.174-.696V5.934c0-.653.64-.976 1.174-.696L6.506 6.091V4.102c0-.653.598-.926 1.164-.696L12.14 5.623c.566.23.566 1.277 0 1.507L8.93 8.188a.5.5 0 0 1-.48-.033L7.506 7.5a.5.5 0 0 1 .48-.967l.944.454 2.21-.895z"/>
                    </svg>
                </button>
                <button class="btn btn-outline-info btn-sm" title="Analytics">📊</button>
                <button class="btn btn-outline-success btn-sm" title="Upload Image">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-image" viewBox="0 0 16 16">
                      <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
                      <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <p>The buttons should be properly aligned and not overlapping. The Send button should be first, followed by Analytics (📊), then Image Upload.</p>
    </div>
</body>
</html>

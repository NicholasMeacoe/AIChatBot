<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Chat Interface</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #chatbox { 
            height: 300px; 
            border: 1px solid #ccc; 
            padding: 10px; 
            margin-bottom: 10px; 
            overflow-y: auto; 
        }
        .user-message { 
            background-color: #e1f5fe; 
            padding: 5px 10px; 
            margin: 5px 0; 
            border-radius: 5px; 
            text-align: right; 
        }
        .bot-message { 
            background-color: #f0f0f0; 
            padding: 5px 10px; 
            margin: 5px 0; 
            border-radius: 5px; 
        }
        #input-area { 
            display: flex; 
            gap: 10px; 
        }
        #message-input { 
            flex-grow: 1; 
            padding: 8px; 
        }
        button { 
            padding: 8px 15px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        button:hover { 
            background-color: #0056b3; 
        }
        .error { 
            color: red; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <h1>Test Chat Interface</h1>
    
    <div id="chatbox"></div>
    
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Type your message...">
        <button id="send-button">Send</button>
    </div>
    
    <div id="status"></div>
    
    <script>
        // Simple chat implementation
        document.addEventListener('DOMContentLoaded', function() {
            const chatbox = document.getElementById('chatbox');
            const messageInput = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const statusDiv = document.getElementById('status');
            
            // Initialize conversation
            let conversationId = null;
            
            // Create a new conversation
            async function createConversation() {
                try {
                    statusDiv.textContent = "Creating conversation...";
                    const response = await fetch('/api/conversations', { method: 'POST' });
                    const data = await response.json();
                    conversationId = data.id;
                    statusDiv.textContent = `Conversation created: ${conversationId}`;
                    return conversationId;
                } catch (error) {
                    statusDiv.innerHTML = `<span class="error">Error creating conversation: ${error.message}</span>`;
                    console.error("Error creating conversation:", error);
                    return null;
                }
            }
            
            // Send a message
            async function sendMessage() {
                const message = messageInput.value.trim();
                if (!message) return;
                
                // Create conversation if needed
                if (!conversationId) {
                    conversationId = await createConversation();
                    if (!conversationId) return;
                }
                
                // Add user message to chat
                const userDiv = document.createElement('div');
                userDiv.className = 'user-message';
                userDiv.textContent = message;
                chatbox.appendChild(userDiv);
                
                // Clear input
                messageInput.value = '';
                
                // Disable button during request
                sendButton.disabled = true;
                statusDiv.textContent = "Sending message...";
                
                try {
                    // Send request to server
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'text/event-stream'
                        },
                        body: JSON.stringify({
                            message: message,
                            conversation_id: conversationId,
                            model_name: 'gemini-2.5-flash',
                            active_context: []
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error ${response.status}`);
                    }
                    
                    // Create bot message container
                    const botDiv = document.createElement('div');
                    botDiv.className = 'bot-message';
                    chatbox.appendChild(botDiv);
                    
                    // Process the stream
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    
                    statusDiv.textContent = "Receiving response...";
                    
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n\n');
                        
                        for (let i = 0; i < lines.length - 1; i++) {
                            const line = lines[i];
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.substring(6));
                                    if (data.text) {
                                        botDiv.innerHTML += data.text;
                                        chatbox.scrollTop = chatbox.scrollHeight;
                                    } else if (data.error) {
                                        statusDiv.innerHTML = `<span class="error">Error: ${data.error}</span>`;
                                    }
                                } catch (e) {
                                    console.error("Error parsing response:", e);
                                }
                            }
                        }
                        
                        buffer = lines[lines.length - 1];
                    }
                    
                    statusDiv.textContent = "Response complete";
                    
                } catch (error) {
                    statusDiv.innerHTML = `<span class="error">Error: ${error.message}</span>`;
                    console.error("Error sending message:", error);
                } finally {
                    sendButton.disabled = false;
                }
            }
            
            // Event listeners
            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Initialize
            statusDiv.textContent = "Ready";
        });
    </script>
</body>
</html>

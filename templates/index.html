<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat - Modern Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .message-content pre {
            background: #1e293b;
            border-radius: 0.5rem;
            padding: 1rem;
            overflow-x: auto;
        }
        .message-content code {
            background: #334155;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }
        .message-content pre code {
            background: transparent;
            padding: 0;
        }
        
        /* Sidebar toggle button styling */
        #sidebar-toggle {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        
        #sidebar-toggle:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.3);
        }
        
        #sidebar-toggle-icon {
            transition: transform 0.3s ease-in-out;
        }
        
        /* Sidebar collapse styles */
        .sidebar-collapsed {
            width: 4rem !important;
        }
        
        .sidebar-collapsed .sidebar-text {
            opacity: 0;
            visibility: hidden;
        }
        
        .sidebar-collapsed .sidebar-content {
            opacity: 0;
            visibility: hidden;
        }
        
        .sidebar-collapsed #sidebar-title {
            opacity: 0;
            visibility: hidden;
        }
        
        .sidebar-collapsed #new-chat-btn {
            width: 2.5rem;
            height: 2.5rem;
            padding: 0;
            justify-content: center;
        }
        
        .sidebar-collapsed #new-chat-btn span {
            display: none;
        }
        
        .sidebar-collapsed #conversations-list {
            opacity: 0;
            visibility: hidden;
        }
        
        /* Collapsed conversation items */
        .sidebar-collapsed .conversation-item {
            width: 2.5rem;
            height: 2.5rem;
            padding: 0;
            justify-content: center;
            align-items: center;
            margin: 0.25rem 0;
        }
        
        .sidebar-collapsed .conversation-item .conversation-text {
            display: none;
        }
        
        .sidebar-collapsed .conversation-item::before {
            content: '💬';
            font-size: 1rem;
        }
        
        /* Smooth transitions */
        .sidebar-text, .sidebar-content, #sidebar-title {
            transition: opacity 0.2s ease-in-out, visibility 0.2s ease-in-out;
        }
        
        #new-chat-btn {
            transition: all 0.3s ease-in-out;
        }
        
        #conversations-list {
            transition: opacity 0.2s ease-in-out, visibility 0.2s ease-in-out;
        }
        
        .conversation-item {
            transition: all 0.3s ease-in-out;
        }
        
        /* Tooltip styles for collapsed sidebar */
        .tooltip {
            position: relative;
        }
        
        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            background: #1f2937;
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            white-space: nowrap;
            z-index: 1000;
            margin-left: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .tooltip:hover::before {
            content: '';
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            border: 5px solid transparent;
            border-right-color: #1f2937;
            z-index: 1000;
        }
        
        /* Mobile responsive */
        @media (max-width: 1024px) {
            #sidebar {
                position: fixed;
                left: -20rem;
                top: 0;
                height: 100vh;
                z-index: 50;
                width: 20rem !important;
            }
            
            #sidebar.mobile-open {
                left: 0;
            }
            
            .sidebar-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 40;
            }
            
            /* Reset collapsed state on mobile */
            #sidebar.sidebar-collapsed {
                width: 20rem !important;
            }
            
            #sidebar.sidebar-collapsed .sidebar-text,
            #sidebar.sidebar-collapsed .sidebar-content,
            #sidebar.sidebar-collapsed #sidebar-title,
            #sidebar.sidebar-collapsed #conversations-list {
                opacity: 1;
                visibility: visible;
            }
            
            #sidebar.sidebar-collapsed #new-chat-btn {
                width: 100%;
                height: auto;
                padding: 0.5rem 1rem;
            }
            
            #sidebar.sidebar-collapsed #new-chat-btn span {
                display: inline;
            }
        }
        .typing-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #64748b;
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-indicator:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        .scroll-smooth { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-dark-950 text-gray-100 font-sans">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div id="sidebar" class="w-80 bg-dark-900 border-r border-dark-700 flex flex-col transition-all duration-300 ease-in-out">
            <!-- Header -->
            <div class="p-6 border-b border-dark-700">
                <div class="flex items-center justify-between mb-4">
                    <h1 id="sidebar-title" class="text-xl font-bold text-white">Gemini Chat</h1>
                    <button id="sidebar-toggle" class="p-2 hover:bg-dark-800 rounded-lg transition-all duration-200 text-gray-400 hover:text-white border border-transparent" title="Toggle Sidebar (Ctrl+B)">
                        <svg id="sidebar-toggle-icon" class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
                        </svg>
                    </button>
                </div>
                <button id="new-chat-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span class="sidebar-text">New Chat</span>
                </button>
            </div>
            
            <!-- Conversations List -->
            <div class="flex-1 overflow-y-auto p-4">
                <div class="space-y-2" id="conversations-list">
                    <!-- Conversations will be loaded here -->
                </div>
            </div>
            
            <!-- Settings -->
            <div class="p-4 border-t border-dark-700 space-y-4">
                <div class="sidebar-content">
                    <label class="block text-sm font-medium text-gray-300 mb-2 sidebar-text">Model</label>
                    <select id="model-select" class="w-full bg-dark-800 border border-dark-600 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        {% for model in available_models %}
                        <option value="{{ model }}" {% if model == default_model %}selected{% endif %}>{{ model }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="sidebar-content">
                    <label class="block text-sm font-medium text-gray-300 mb-2 sidebar-text">System Prompt</label>
                    <textarea id="system-prompt" placeholder="Enter system prompt..." class="w-full bg-dark-800 border border-dark-600 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none" rows="3"></textarea>
                </div>
            </div>
        </div>
        
        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col">
            <!-- Chat Header -->
            <div class="bg-dark-900 border-b border-dark-700 p-4 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <!-- Mobile sidebar toggle (hidden on desktop) -->
                    <button id="mobile-sidebar-toggle" class="lg:hidden p-2 hover:bg-dark-800 rounded-lg transition-colors duration-200 text-gray-400 hover:text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <div>
                        <h2 id="chat-title" class="text-lg font-semibold text-white">Select a conversation</h2>
                        <p class="text-sm text-gray-400" id="chat-subtitle">Choose a conversation to start chatting</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <!-- History Filter -->
                    <select id="history-filter" class="bg-dark-800 border border-dark-600 rounded-lg px-3 py-2 text-white text-sm focus:ring-2 focus:ring-blue-500">
                        <option value="">All History</option>
                    </select>
                    <!-- Context Toggle -->
                    <button id="context-toggle" class="bg-dark-800 hover:bg-dark-700 text-white px-3 py-2 rounded-lg transition-colors duration-200 text-sm">
                        Context
                    </button>
                </div>
            </div>
            
            <!-- Context Panel (Hidden by default) -->
            <div id="context-panel" class="bg-dark-800 border-b border-dark-700 p-4 hidden">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-medium text-white">Active Context</h3>
                    <button id="clear-context" class="text-red-400 hover:text-red-300 text-sm">Clear All</button>
                </div>
                <div id="context-items" class="space-y-2 mb-3">
                    <!-- Context items will appear here -->
                </div>
                <div class="flex gap-2 flex-wrap">
                    <button id="add-file-context" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm">Browse Files</button>
                    <button id="upload-file-context" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded text-sm">Upload Files</button>
                    <button id="add-folder-context" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm">Add Folder</button>
                    <button id="add-url-context" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1 rounded text-sm">Add URL</button>
                </div>
            </div>
            
            <!-- Messages Area -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4" id="messages-container">
                <div class="text-center text-gray-400 py-8">
                    <svg class="w-16 h-16 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                    <p>Start a conversation to see messages here</p>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="bg-dark-900 border-t border-dark-700 p-4">
                <div class="flex items-end gap-3">
                    <div class="flex-1">
                        <textarea 
                            id="message-input" 
                            placeholder="Type your message..." 
                            class="w-full bg-dark-800 border border-dark-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                            rows="1"
                            style="min-height: 44px; max-height: 120px;"
                        ></textarea>
                    </div>
                    <button 
                        id="send-btn" 
                        class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-600 disabled:cursor-not-allowed text-white px-6 py-3 rounded-lg transition-colors duration-200 flex items-center gap-2"
                        disabled
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg>
                        Send
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modals -->
    <!-- File Upload Modal -->
    <div id="upload-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-dark-800 rounded-lg p-6 w-96 max-w-[90vw]">
            <h3 class="text-lg font-semibold text-white mb-4">Upload Files</h3>
            
            <!-- Drag and Drop Area -->
            <div id="drop-zone" class="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center mb-4 transition-colors hover:border-blue-500">
                <div class="text-gray-400 mb-2">
                    <svg class="mx-auto h-12 w-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                </div>
                <p class="text-white mb-1">Drag and drop files here</p>
                <p class="text-gray-400 text-sm mb-3">or</p>
                <button id="browse-files" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Browse Files</button>
                <input type="file" id="file-input" multiple accept="image/*,text/*,.pdf,.doc,.docx,.txt,.md,.json,.csv" class="hidden">
            </div>
            
            <!-- File Preview Area -->
            <div id="file-preview" class="max-h-48 overflow-y-auto mb-4 hidden">
                <h4 class="text-white text-sm font-medium mb-2">Selected Files:</h4>
                <div id="file-list-preview" class="space-y-2"></div>
            </div>
            
            <!-- Upload Progress -->
            <div id="upload-progress" class="hidden mb-4">
                <div class="bg-gray-700 rounded-full h-2">
                    <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <p id="progress-text" class="text-gray-400 text-sm mt-1">Uploading...</p>
            </div>
            
            <div class="flex justify-end gap-2">
                <button id="cancel-upload" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">Cancel</button>
                <button id="confirm-upload" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded" disabled>Upload</button>
            </div>
        </div>
    </div>

    <!-- File Selection Modal -->
    <div id="file-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-dark-800 rounded-lg p-6 w-96 max-h-96">
            <h3 class="text-lg font-semibold text-white mb-4">Select File</h3>
            <div class="max-h-64 overflow-y-auto space-y-2" id="file-list">
                <!-- Files will be loaded here -->
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button id="cancel-file" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">Cancel</button>
            </div>
        </div>
    </div>
    
    <!-- Folder Selection Modal -->
    <div id="folder-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-dark-800 rounded-lg p-6 w-96 max-h-96">
            <h3 class="text-lg font-semibold text-white mb-4">Select Folder</h3>
            <div class="max-h-64 overflow-y-auto space-y-2" id="folder-list">
                <!-- Folders will be loaded here -->
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button id="cancel-folder" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">Cancel</button>
            </div>
        </div>
    </div>
    
    <!-- URL Input Modal -->
    <div id="url-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-dark-800 rounded-lg p-6 w-96">
            <h3 class="text-lg font-semibold text-white mb-4">Add URL</h3>
            <input type="url" id="url-input" placeholder="https://example.com" class="w-full bg-dark-700 border border-dark-600 rounded-lg px-3 py-2 text-white mb-4">
            <div class="flex justify-end gap-2">
                <button id="cancel-url" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">Cancel</button>
                <button id="add-url" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Add</button>
            </div>
        </div>
    </div>

    <script>
        class ModernGeminiChat {
            constructor() {
                console.log('🚀 Initializing ModernGeminiChat...');
                this.currentConversationId = null;
                this.contextItems = [];
                this.isGenerating = false;
                
                this.initializeElements();
                this.setupEventListeners();
                this.setupAutoResize();
                this.initializeSidebarState();
                
                console.log('✅ ModernGeminiChat initialized');
            }
            
            initializeElements() {
                this.elements = {
                    newChatBtn: document.getElementById('new-chat-btn'),
                    conversationsList: document.getElementById('conversations-list'),
                    messagesContainer: document.getElementById('messages-container'),
                    messageInput: document.getElementById('message-input'),
                    sendBtn: document.getElementById('send-btn'),
                    modelSelect: document.getElementById('model-select'),
                    systemPrompt: document.getElementById('system-prompt'),
                    contextToggle: document.getElementById('context-toggle'),
                    contextPanel: document.getElementById('context-panel'),
                    contextItems: document.getElementById('context-items'),
                    clearContext: document.getElementById('clear-context'),
                    addFileContext: document.getElementById('add-file-context'),
                    uploadFileContext: document.getElementById('upload-file-context'),
                    addFolderContext: document.getElementById('add-folder-context'),
                    addUrlContext: document.getElementById('add-url-context'),
                    chatTitle: document.getElementById('chat-title'),
                    chatSubtitle: document.getElementById('chat-subtitle'),
                    historyFilter: document.getElementById('history-filter'),
                    // Sidebar toggle elements
                    sidebar: document.getElementById('sidebar'),
                    sidebarToggle: document.getElementById('sidebar-toggle'),
                    sidebarToggleIcon: document.getElementById('sidebar-toggle-icon'),
                    mobileSidebarToggle: document.getElementById('mobile-sidebar-toggle')
                };
            }
            
            setupEventListeners() {
                // Chat functionality
                this.elements.newChatBtn.addEventListener('click', () => this.createNewChat());
                this.elements.sendBtn.addEventListener('click', () => this.sendMessage());
                this.elements.messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                
                // Input validation
                this.elements.messageInput.addEventListener('input', () => {
                    const hasText = this.elements.messageInput.value.trim().length > 0;
                    this.elements.sendBtn.disabled = !hasText || this.isGenerating;
                });
                
                // Context management
                this.elements.contextToggle.addEventListener('click', () => this.toggleContextPanel());
                this.elements.clearContext.addEventListener('click', () => this.clearAllContext());
                this.elements.addFileContext.addEventListener('click', () => this.showFileModal());
                this.elements.uploadFileContext.addEventListener('click', () => this.showUploadModal());
                this.elements.addFolderContext.addEventListener('click', () => this.showFolderModal());
                this.elements.addUrlContext.addEventListener('click', () => this.showUrlModal());
                
                // Sidebar toggle functionality
                this.elements.sidebarToggle.addEventListener('click', () => this.toggleSidebar());
                this.elements.mobileSidebarToggle.addEventListener('click', () => this.toggleMobileSidebar());
                
                // Close mobile sidebar when clicking outside
                document.addEventListener('click', (e) => {
                    if (window.innerWidth <= 1024 && 
                        this.elements.sidebar.classList.contains('mobile-open') &&
                        !this.elements.sidebar.contains(e.target) &&
                        !this.elements.mobileSidebarToggle.contains(e.target)) {
                        this.closeMobileSidebar();
                    }
                });
                
                // Handle window resize
                window.addEventListener('resize', () => {
                    if (window.innerWidth > 1024) {
                        this.closeMobileSidebar();
                    }
                });
                
                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    // Ctrl/Cmd + B to toggle sidebar
                    if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
                        e.preventDefault();
                        if (window.innerWidth > 1024) {
                            this.toggleSidebar();
                        } else {
                            this.toggleMobileSidebar();
                        }
                    }
                    
                    // Escape to close mobile sidebar
                    if (e.key === 'Escape' && window.innerWidth <= 1024) {
                        this.closeMobileSidebar();
                    }
                });
                
                // Modal handlers
                this.setupModalHandlers();
            }
            
            setupModalHandlers() {
                // File modal
                document.getElementById('cancel-file').addEventListener('click', () => {
                    document.getElementById('file-modal').classList.add('hidden');
                });
                
                // Upload modal handlers
                this.setupUploadModal();
                
                // Folder modal
                document.getElementById('cancel-folder').addEventListener('click', () => {
                    document.getElementById('folder-modal').classList.add('hidden');
                });
                
                // URL modal
                document.getElementById('cancel-url').addEventListener('click', () => {
                    document.getElementById('url-modal').classList.add('hidden');
                });
                
                document.getElementById('add-url').addEventListener('click', () => {
                    const url = document.getElementById('url-input').value.trim();
                    if (url) {
                        this.addContextItem(url, 'url');
                        document.getElementById('url-modal').classList.add('hidden');
                        document.getElementById('url-input').value = '';
                    }
                });
            }
            
            setupAutoResize() {
                const textarea = this.elements.messageInput;
                textarea.addEventListener('input', () => {
                    textarea.style.height = 'auto';
                    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
                });
            }
            
            async loadConversations() {
                console.log('📋 Loading conversations...');
                try {
                    const response = await fetch('/api/conversations');
                    console.log('📋 Conversations response:', response.status);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const conversations = await response.json();
                    console.log('📋 Found conversations:', conversations.length);
                    
                    this.elements.conversationsList.innerHTML = '';
                    
                    conversations.forEach(conv => {
                        const div = document.createElement('div');
                        div.className = 'conversation-item p-3 rounded-lg cursor-pointer transition-colors duration-200 hover:bg-dark-800 tooltip';
                        div.dataset.id = conv.id;
                        div.setAttribute('data-tooltip', conv.name);
                        div.innerHTML = `
                            <div class="conversation-text">
                                <div class="font-medium text-white truncate">${conv.name}</div>
                                <div class="text-sm text-gray-400">${new Date(conv.timestamp).toLocaleDateString()}</div>
                            </div>
                        `;
                        div.addEventListener('click', () => this.loadConversation(conv.id, conv.name));
                        this.elements.conversationsList.appendChild(div);
                    });
                    
                    // Load first conversation if available
                    if (conversations.length > 0 && !this.currentConversationId) {
                        console.log('📋 Loading first conversation:', conversations[0].name);

            createContextInfoMessage() {

            async sendMessage() {
                console.log('💬 Sending message...');
                const message = this.elements.messageInput.value.trim();
                console.log('💬 Message:', message);
                console.log('💬 Conversation ID:', this.currentConversationId);
                
                if (!message || !this.currentConversationId || this.isGenerating) {
                    console.log('❌ Cannot send message - missing requirements');
                    return;
                }
                
                // Check for multimodal content
                const hasImages = await this.checkForImageContext();
                const selectedModel = this.elements.modelSelect.value;
                const useMultimodal = hasImages && this.isVisionModel(selectedModel);
                
                console.log(`🖼️ Images detected: ${hasImages}, Vision model: ${this.isVisionModel(selectedModel)}, Using multimodal: ${useMultimodal}`);
                
                this.isGenerating = true;
                this.elements.sendBtn.disabled = true;
                this.elements.messageInput.value = '';
                this.elements.messageInput.style.height = 'auto';
                
                // Add user message
                this.addMessage(message, 'user');
                
                // Add context info if present
                if (this.contextItems && this.contextItems.length > 0) {
                    const contextInfo = this.createContextInfoMessage();
                    this.addMessage(contextInfo, 'system');
                }
                
                // Add typing indicator
                const typingDiv = this.addMessage('', 'assistant', null, true);
                
                try {
                    // Choose endpoint based on multimodal needs
                    const endpoint = useMultimodal ? '/api/chat_multimodal' : '/api/chat';
                    
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: message,
                            conversation_id: this.currentConversationId,
                            model: selectedModel,
                            context_items: this.contextItems,
                            active_context: this.contextItems // For compatibility with new endpoint
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const reader = response.body.getReader();
                    let assistantMessage = '';
                    
                    // Remove typing indicator
                    typingDiv.remove();
                    const assistantDiv = this.addMessage('', 'assistant');
                    const contentDiv = assistantDiv.querySelector('.message-content');
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        const chunk = new TextDecoder().decode(value);
                        const lines = chunk.split('\n');
                        
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    
                                    if (data.text) {
                                        assistantMessage += data.text;
                                        contentDiv.innerHTML = this.formatMessage(assistantMessage);
                                        this.scrollToBottom();
                                    }
                                    
                                    if (data.error) {
                                        contentDiv.innerHTML = `<div class="text-red-400">Error: ${data.error}</div>`;
                                    }
                                    
                                    if (data.context_errors) {
                                        const errorDiv = document.createElement('div');
                                        errorDiv.className = 'text-yellow-400 text-sm mb-2';
                                        errorDiv.textContent = 'Context errors: ' + data.context_errors.join(', ');
                                        contentDiv.prepend(errorDiv);
                                    }
                                    
                                    if (data.done) {
                                        // Refresh conversation to show new message
                                        setTimeout(() => {
                                            this.loadConversation(this.currentConversationId, this.elements.chatTitle.textContent);
                                        }, 500);
                                    }
                                } catch (e) {
                                    console.error('Error parsing SSE data:', e);
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error sending message:', error);
                    if (typingDiv && typingDiv.parentNode) {
                        typingDiv.remove();
                    }
                    const errorDiv = this.addMessage('Sorry, there was an error processing your message. Please try again.', 'assistant');
                    errorDiv.querySelector('.message-content').classList.add('text-red-400');
                } finally {
                    this.isGenerating = false;
                    this.elements.sendBtn.disabled = false;
                }
            }

            getFileTypeIcon(filename) {
                const ext = filename.toLowerCase().split('.').pop();
                
                // Image files
                if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].includes(ext)) {
                    return '🖼️';
                }
                // Document files
                if (['pdf'].includes(ext)) {
                    return '📕';
                }
                if (['doc', 'docx'].includes(ext)) {
                    return '📘';
                }
                if (['txt', 'md'].includes(ext)) {
                    return '📄';
                }
                if (['json'].includes(ext)) {
                    return '📋';
                }
                if (['csv'].includes(ext)) {
                    return '📊';
                }
                // Audio files
                if (['mp3', 'wav', 'm4a', 'ogg'].includes(ext)) {
                    return '🎵';
                }
                // Video files
                if (['mp4', 'avi', 'mov', 'mkv'].includes(ext)) {
                    return '🎬';
                }
                
                return '📎'; // Default file icon
            }
            
            isImageFile(filename) {
                const ext = filename.toLowerCase().split('.').pop();
                return ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].includes(ext);
            }
            
            setupUploadModal() {
                const uploadModal = document.getElementById('upload-modal');
                const dropZone = document.getElementById('drop-zone');
                const fileInput = document.getElementById('file-input');
                const browseButton = document.getElementById('browse-files');
                const cancelButton = document.getElementById('cancel-upload');
                const confirmButton = document.getElementById('confirm-upload');
                const filePreview = document.getElementById('file-preview');
                const fileListPreview = document.getElementById('file-list-preview');
                
                let selectedFiles = [];
                
                // Browse files button
                browseButton.addEventListener('click', () => {
                    fileInput.click();
                });
                
                // File input change
                fileInput.addEventListener('change', (e) => {
                    this.handleFileSelection(Array.from(e.target.files));
                });
                
                // Drag and drop handlers
                dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropZone.classList.add('border-blue-500', 'bg-blue-900', 'bg-opacity-20');
                });
                
                dropZone.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('border-blue-500', 'bg-blue-900', 'bg-opacity-20');
                });
                
                dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('border-blue-500', 'bg-blue-900', 'bg-opacity-20');
                    const files = Array.from(e.dataTransfer.files);
                    this.handleFileSelection(files);
                });
                
                // Cancel button
                cancelButton.addEventListener('click', () => {
                    this.closeUploadModal();
                });
                
                // Confirm upload button
                confirmButton.addEventListener('click', () => {
                    this.uploadFiles();
                });
                
                // Store references for later use
                this.uploadModal = {
                    modal: uploadModal,
                    filePreview,
                    fileListPreview,
                    confirmButton,
                    selectedFiles: []
                };
            }

                document.getElementById('upload-modal').classList.remove('hidden');
                this.resetUploadModal();
            }
            
            closeUploadModal() {
                document.getElementById('upload-modal').classList.add('hidden');

            resetUploadModal() {
                const fileInput = document.getElementById('file-input');
                const filePreview = document.getElementById('file-preview');
                const fileListPreview = document.getElementById('file-list-preview');
                const confirmButton = document.getElementById('confirm-upload');
                const uploadProgress = document.getElementById('upload-progress');

                filePreview.classList.add('hidden');

            handleFileSelection(files) {
                if (!files || files.length === 0) return;
                
                const filePreview = document.getElementById('file-preview');
                const fileListPreview = document.getElementById('file-list-preview');
                const confirmButton = document.getElementById('confirm-upload');
                
                // Store selected files
                this.uploadModal.selectedFiles = files;
                
                // Clear previous preview
                fileListPreview.innerHTML = '';
                
                // Show preview for each file
                files.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'flex items-center justify-between p-2 bg-dark-700 rounded text-sm';
                    
                    const fileInfo = document.createElement('div');
                    fileInfo.className = 'flex items-center space-x-2';
                    
                    // File icon based on type
                    const icon = this.getFileIcon(file.type);
                    fileInfo.innerHTML = `
                        <span class="text-gray-400">${icon}</span>
                        <span class="text-white">${file.name}</span>
                        <span class="text-gray-400">(${this.formatFileSize(file.size)})</span>
                    `;
                    
                    // Remove button
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'text-red-400 hover:text-red-300 ml-2';
                    removeBtn.innerHTML = '×';
                    removeBtn.addEventListener('click', () => {
                        this.removeFileFromSelection(index);
                    });
                    
                    fileItem.appendChild(fileInfo);
                    fileItem.appendChild(removeBtn);
                    fileListPreview.appendChild(fileItem);
                    
                    // Show image preview for image files
                    if (file.type.startsWith('image/')) {
                        this.showImagePreview(file, fileItem);
                    }
                });
                
                // Show preview section and enable upload button
                filePreview.classList.remove('hidden');
                confirmButton.disabled = false;

            removeFileFromSelection(index) {
                this.uploadModal.selectedFiles.splice(index, 1);
                this.handleFileSelection(this.uploadModal.selectedFiles);
                
                if (this.uploadModal.selectedFiles.length === 0) {
                    document.getElementById('file-preview').classList.add('hidden');
                    document.getElementById('confirm-upload').disabled = true;
                }

            getFileIcon(mimeType) {
                if (mimeType.startsWith('image/')) return '🖼️';
                if (mimeType.startsWith('text/')) return '📄';
                if (mimeType.includes('pdf')) return '📕';
                if (mimeType.includes('word')) return '📘';
                if (mimeType.includes('json')) return '📋';
                if (mimeType.includes('csv')) return '📊';
                return '📎';
            }
            
            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            async uploadFiles() {
                if (!this.uploadModal.selectedFiles || this.uploadModal.selectedFiles.length === 0) {
                    return;
                }
                
                console.log('🔄 Starting upload of', this.uploadModal.selectedFiles.length, 'files');
                
                const uploadProgress = document.getElementById('upload-progress');
                const progressBar = document.getElementById('progress-bar');
                const progressText = document.getElementById('progress-text');
                const confirmButton = document.getElementById('confirm-upload');
                
                // Show progress

                confirmButton.disabled = true;
                
                try {
                    const formData = new FormData();
                    
                    // Add files to form data
                    this.uploadModal.selectedFiles.forEach((file, index) => {
                        console.log(`📎 Adding file ${index + 1}:`, file.name, file.type, file.size);
                        formData.append('files', file);
                    });
                    
                    console.log('🚀 Sending upload request to /api/context/upload');
                    
                    // Upload with progress tracking
                    const response = await fetch('/api/context/upload', {
                        method: 'POST',
                        body: formData
                    });
                    
                    console.log('📡 Upload response status:', response.status);
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('❌ Upload failed:', response.status, errorText);
                        throw new Error(`Upload failed: ${response.status} ${response.statusText}`);
                    }
                    
                    const result = await response.json();
                    console.log('✅ Upload successful:', result);
                    
                    // Update progress to 100%
                    progressBar.style.width = '100%';
                    progressText.textContent = 'Upload complete!';
                    
                    // Add uploaded files to context
                    if (result.uploaded_files) {
                        result.uploaded_files.forEach(filePath => {
                            console.log('📁 Adding to context:', filePath);
                            chat.addContextItem(filePath, 'uploaded');
                        });
                    }
                    
                    // Show any errors as warnings
                    if (result.errors && result.errors.length > 0) {
                        console.warn('⚠️ Upload warnings:', result.errors);
                        // You could show these to the user if needed
                    }
                    
                    // Close modal after short delay
                    setTimeout(() => {
                        chat.closeUploadModal();
                    }, 1000);
                    
                } catch (error) {
                    console.error('💥 Upload error:', error);
                    progressText.textContent = `Upload failed: ${error.message}`;
                    progressBar.style.width = '0%';
                    confirmButton.disabled = false;
                }
            }

            showUrlModal() {
                document.getElementById('url-modal').classList.remove('hidden');
                document.getElementById('url-input').focus();
            }
        }
        
        // Initialize the chat application
        const chat = new ModernGeminiChat();
        
        // Initialize Mermaid
        mermaid.initialize({ 
            theme: 'dark',
            startOnLoad: true 
        });
        
        // Load conversations when page is ready
        document.addEventListener('DOMContentLoaded', () => {
            chat.loadConversations();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .upload-area { border: 2px dashed #ccc; padding: 20px; margin: 20px 0; text-align: center; }
        .upload-area.dragover { border-color: #007bff; background-color: #f0f8ff; }
        button { padding: 10px 20px; margin: 5px; }
        .result { margin: 20px 0; padding: 10px; border: 1px solid #ddd; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>File Upload Test</h1>
    
    <div class="upload-area" id="uploadArea">
        <p>Drag and drop files here or click to select</p>
        <input type="file" id="fileInput" multiple style="display: none;">
        <button onclick="document.getElementById('fileInput').click()">Select Files</button>
    </div>
    
    <div id="fileList"></div>
    
    <button id="uploadBtn" onclick="uploadFiles()" disabled>Upload Files</button>
    <button onclick="clearFiles()">Clear</button>
    
    <div id="result"></div>

    <script>
        let selectedFiles = [];
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const uploadBtn = document.getElementById('uploadBtn');
        const result = document.getElementById('result');
        
        // Drag and drop handlers
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(Array.from(e.dataTransfer.files));
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(Array.from(e.target.files));
        });
        
        function handleFiles(files) {
            selectedFiles = files;
            displayFiles();
            uploadBtn.disabled = files.length === 0;
        }
        
        function displayFiles() {
            fileList.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const div = document.createElement('div');
                div.innerHTML = `
                    <strong>${file.name}</strong> (${file.type || 'unknown'}) - ${formatFileSize(file.size)}
                    <button onclick="removeFile(${index})">Remove</button>
                `;
                fileList.appendChild(div);
            });
        }
        
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            displayFiles();
            uploadBtn.disabled = selectedFiles.length === 0;
        }
        
        function clearFiles() {
            selectedFiles = [];
            fileInput.value = '';
            displayFiles();
            uploadBtn.disabled = true;
            result.innerHTML = '';
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        async function uploadFiles() {
            if (selectedFiles.length === 0) return;
            
            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('files', file);
            });
            
            try {
                result.innerHTML = '<p>Uploading...</p>';
                
                const response = await fetch('/api/context/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = `
                        <div class="success">
                            <h3>Upload Successful!</h3>
                            <p>Uploaded ${data.success_count} file(s):</p>
                            <ul>
                                ${data.uploaded_files.map(file => `<li>${file}</li>`).join('')}
                            </ul>
                            ${data.errors ? `<p>Warnings: ${data.errors.join(', ')}</p>` : ''}
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="error">
                            <h3>Upload Failed</h3>
                            <p>${data.error || 'Unknown error'}</p>
                            ${data.details ? `<p>Details: ${data.details.join(', ')}</p>` : ''}
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        <h3>Upload Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
